# Site settings
locale                   : "en-US"
title                    : "Zichuan Xu"
name                     : "Zichuan Xu"
description              : "Zichuan Xu's homepage for multi-agent learning, emergent communication, and practical AI systems."
url                      : https://zichuanxu.me
baseurl                  : ""
repository               : "zichuanxu/zichuanxu.github.io"

# Build settings
encoding                 : "utf-8"
timezone                 : Etc/UTC

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .github
  - docs
  - .superpowers
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - LICENSE
  - Dockerfile
  - docker-compose.yaml

# Plugins (GitHub Pages --safe: only whitelisted plugins run)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# Posts: _posts/YYYY-MM-DD-slug.md → /blog/slug/, laid out by _layouts/post.html.
# Front matter: title, description (one line, shown in lists and previews);
# optional: updated, lang (e.g. ja), minutes (reading time override), image (a 1200×630 share card, e.g. /images/og/slug.png).
# Visitor map on the homepage (shown only when set). Paste the script's src from
# mapmyvisitors.com or clustrmaps.com, e.g. "//mapmyvisitors.com/map.js?d=…&cl=ffffff&w=a".
visitor_map: "//mapmyvisitors.com/map.js?d=C5eB6W-Glyuv_L_VYwWxu3QNNJ-5_mZO2H4wHXYguQk&cl=ffffff&w=a&t=tt&co=0a0af0&ct=ffffff&cmo=f2a777&cmn=ff5353"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
