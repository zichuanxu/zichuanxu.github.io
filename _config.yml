# Site settings
locale                   : "en-US"
title                    : "Zichuan Xu"
name                     : "Zichuan Xu"
description              : "Zichuan Xu's homepage for multi-agent learning, emergent communication, and practical AI systems."
url                      : https://zichuanxu.me
baseurl                  : ""
repository               : "zichuanxu/zichuanxu.github.io"

# Build settings
encoding                 : "utf-8"
timezone                 : Etc/UTC

# Reading files
include:
  - _pages
exclude:
  - .bundle
  - .github
  - docs
  - .superpowers
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - LICENSE
  - Dockerfile
  - docker-compose.yaml

# Plugins (GitHub Pages --safe: only whitelisted plugins run)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# Posts: _posts/YYYY-MM-DD-slug.md → /blog/slug/, laid out by _layouts/post.html.
# Front matter: title, description (one line, shown in lists and previews);
# optional: updated, lang (e.g. ja), minutes (reading time override), image.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
