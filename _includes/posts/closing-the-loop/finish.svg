<svg class="ch" viewBox="0 0 720 390" role="img" aria-labelledby="finish-t finish-d"><title id="finish-t">Accuracy against the share of answers that finish</title><desc id="finish-d">Every thinking-mode run on MATH-500. Accuracy rises with the share of answers that finish; the edits that finish most answers lie near a line of slope 0.71 through the origin. CLC-sel finishes 82% and scores 56.3%; the Astra edit finishes 68% and scores 49.7%; the automatic layer-13 edit finishes 90% but scores 49.6%.</desc>
