<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% include site-2026/theme-init.html %}
{%- assign desc = include.description | strip_html | strip_newlines | strip | escape %}
<title>{{ include.title }}</title>
<meta name="description" content="{{ desc }}" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />
<meta property="og:type" content="{{ include.type | default: 'website' }}" />
<meta property="og:site_name" content="Zichuan Xu" />
<meta property="og:title" content="{{ include.title | escape }}" />
<meta property="og:description" content="{{ desc }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
{%- comment %} share cards are 1200×630 PNGs in /images/og/; a post names its own with `image:` {% endcomment %}
<meta property="og:image" content="{{ site.url }}{{ page.image | default: '/images/og/site.png' }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{ include.title | escape }}" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/assets/css/site-2026.css?v={{ site.time | date: '%s' }}" />
<link rel="icon" href="/favicon.ico?v={{ site.time | date: '%s' }}" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v={{ site.time | date: '%s' }}" />
<link rel="apple-touch-icon" href="/images/apple-touch-icon-180x180.png?v={{ site.time | date: '%s' }}" />
<link rel="alternate" type="application/atom+xml" title="Zichuan Xu: Blog" href="/feed.xml" />
