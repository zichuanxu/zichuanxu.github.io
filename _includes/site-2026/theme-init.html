<meta name="theme-color" content="#F6F5F0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<script>
  (() => {
    document.documentElement.classList.add('has-js');
    try {
      const theme = localStorage.getItem('site-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.content = theme === 'dark' ? '#0F1115' : '#F6F5F0';
        });
      }
    } catch (_) {}
  })();
</script>
