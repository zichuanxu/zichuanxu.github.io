<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" />
<script>
  (() => {
    const root = document.documentElement;
    /* ?still shows the page at rest (no reveals, no loops), for screenshots */
    if (!/[?&]still\b/.test(location.search)) {
      root.classList.add('has-js');
      /* .has-js hides what the page script reveals; if that script never arrives, show everything */
      setTimeout(() => { if (!window.__site) root.classList.remove('has-js'); }, 4000);
    }
    try {
      const theme = localStorage.getItem('site-theme');
      if (theme === 'light' || theme === 'dark') {
        root.dataset.theme = theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.content = theme === 'dark' ? '#111214' : '#F2F2EF';
        });
      }
    } catch (_) {}
  })();
</script>
