<header class="bar">
  <div class="wrap">
    <a class="brand" href="{% if include.nav %}#top{% else %}/{% endif %}" aria-label="Zichuan Xu, {% if include.nav %}back to top{% else %}home{% endif %}"><span class="mark" aria-hidden="true">ZX</span>Zichuan Xu</a>
    <div class="bar-right">
      {%- if include.nav %}
      <nav class="nav" aria-label="Sections">
        <a href="#experience" data-spy="experience"><span class="plat" aria-hidden="true">1</span>Experience</a>
        <a href="#projects" data-spy="projects"><span class="plat" aria-hidden="true">2</span>Projects</a>
        <a href="#education" data-spy="education"><span class="plat" aria-hidden="true">3</span>Education</a>
        <a href="#skills" data-spy="skills"><span class="plat" aria-hidden="true">4</span>Skills</a>
        <a href="#contact" data-spy="contact"><span class="plat" aria-hidden="true">5</span>Contact</a>
      </nav>
      {%- endif %}
      <button class="toggle" type="button" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
      </button>
    </div>
  </div>
</header>

<script>
  (() => {
    /* Theme toggle: an explicit choice lives in localStorage['site-theme'];
       without one the page follows the system and keeps following it. */
    const root = document.documentElement;
    const toggle = document.querySelector('.bar .toggle');
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const current = () => root.dataset.theme || (media.matches ? 'dark' : 'light');
    const sync = () => {
      const theme = current();
      document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
        meta.content = theme === 'dark' ? '#0F1115' : '#F6F5F0';
      });
      toggle.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`);
    };
    toggle.addEventListener('click', () => {
      root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('site-theme', root.dataset.theme); } catch (_) {}
      sync();
    });
    media.addEventListener?.('change', () => { if (!root.dataset.theme) sync(); });
    sync();
  })();
</script>
